syntax = "proto3";
package dydxprotocol.canonicalusdc;

option go_package = "github.com/dydxprotocol/v4-chain/protocol/x/canonicalusdc/types";

// Mode controls whether canonical USDC routing is active.
enum Mode {
  // MODE_UNSPECIFIED is invalid in configured state.
  MODE_UNSPECIFIED = 0;
  // MODE_DISABLED preserves the legacy transfer stack exactly.
  MODE_DISABLED = 1;
  // MODE_GRADUAL enables canonical Injective routing for logical USDC.
  MODE_GRADUAL = 2;
  // MODE_PAUSED rejects canonical USDC transfers while retaining pending state.
  MODE_PAUSED = 3;
}

// Route identifies the physical settlement route for a logical USDC transfer.
enum Route {
  // ROUTE_UNSPECIFIED is not a valid settlement route.
  ROUTE_UNSPECIFIED = 0;
  // ROUTE_INJECTIVE settles with Injective-origin USDC.
  ROUTE_INJECTIVE = 1;
  // ROUTE_NOBLE settles with Noble-origin USDC.
  ROUTE_NOBLE = 2;
  reserved 3;
  reserved "ROUTE_BACKING_SWAP";
}

// Controls binds canonical routing to exact channels and denominations.
message Controls {
  Mode mode = 1;
  string logical_denom = 2;
  string noble_channel = 3;
  string injective_channel = 4;
  string injective_packet_denom = 5;
  string injective_denom = 6;
  bool noble_withdrawals_enabled = 7;
  int64 noble_withdrawal_cutoff_timestamp = 8;
  string max_transfer_amount = 9;
  string migration_ceiling = 10;
  uint32 max_pending_settlements = 11;
  reserved 12;
  reserved "memo_version";
  string noble_packet_denom = 13;
  string noble_client = 14;
  string noble_connection = 15;
  string injective_client = 16;
  string injective_connection = 17;
}

// Ledger accounts for backing and in-flight settlement without changing the
// logical application denomination.
message Ledger {
  string noble_backing = 1;
  string injective_backing = 2;
  string legacy_downstream = 3;
  reserved 4, 7;
  reserved "restricted_funding", "pending_backing_swap";
  string pending_injective = 5;
  string pending_noble = 6;
}

// PendingSettlement records enough logical and physical state to settle a
// packet acknowledgement or timeout exactly once.
message PendingSettlement {
  Route route = 1;
  string source_channel = 2;
  uint64 sequence = 3;
  string sender = 4;
  string logical_receiver = 5;
  string physical_receiver = 6;
  string logical_denom = 7;
  string physical_denom = 8;
  string amount = 9;
  reserved 10, 11;
  reserved "memo", "controller";
}
